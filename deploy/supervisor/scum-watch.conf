[program:scum-watch]
; FTP-демон: мониторинг логов SCUM, синхронизация SCUM.db, подогрев кэша карты.
process_name=%(program_name)s
command=php /var/www/scum-manager-laravel/artisan scum:watch --poll=250
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/scum-manager-laravel/storage/logs/supervisor-watch.log
stopwaitsecs=30