[program:scum-scheduler]
; Планировщик Laravel (schedule:work): каждая минута ставит тик плагинов в очередь
; scum_jobs (исполняет scum-rcon) и раз в 15 минут запускает обслуживание БД/кэша.
process_name=%(program_name)s
command=php /var/www/scum-manager-laravel/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/scum-manager-laravel/storage/logs/supervisor-scheduler.log
stopwaitsecs=30