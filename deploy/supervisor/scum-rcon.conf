[program:scum-rcon]
; RCON-демон: единственный владелец RCON-сокета, исполняет очередь scum_jobs.
process_name=%(program_name)s
command=php /var/www/scum-manager-laravel/artisan scum:rcon --poll=150
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/scum-manager-laravel/storage/logs/supervisor-rcon.log
stopwaitsecs=30